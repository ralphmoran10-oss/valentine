<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will you be my Valentine?</title>
  <style>
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: system-ui, Arial; background: linear-gradient(135deg,#ff9a9e,#fad0c4);
      overflow:hidden;
    }
    .card{
      width:min(520px,92vw); padding:26px; border-radius:22px; text-align:center;
      background:#ffffffcc; border:1px solid #ffffff80; backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,.12);
      position:relative;
    }
    button{
      border:none; padding:14px 18px; border-radius:999px; font-weight:800;
      cursor:pointer; margin:8px; font-size:16px;
    }
    #yesBtn{background:#ff2e63;color:#fff}
    #noBtn{background:#fff;border:2px solid #00000015;color:#6c757d}
    .heart{
      position:fixed; bottom:-30px; animation: floatUp linear forwards;
      pointer-events:none; opacity:.9;
    }
    @keyframes floatUp{
      to{ transform: translateY(-120vh) translateX(var(--dx)); opacity:0; }
    }
    #successBox{
      display:none; margin-top:10px; padding:14px; border-radius:16px;
      background:#ffffffb3; border:1px solid #00000010;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1 id="title">Will you be my Valentine? 💘</h1>
    <p id="subtitle">This took me rong rong time🙁</p>

    <div id="buttons">
      <button id="yesBtn">Yes 🥳</button>
      <button id="noBtn">No 😾</button>
    </div>

    <div id="successBox">
      <h2>YAY!! 🥳💞</h2>
      <p>I LAV U BABY💕💕</p>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const successBox = document.getElementById("successBox");
    const buttons = document.getElementById("buttons");

    function spawnHeart(){
      const h=document.createElement("div");
      h.className="heart";
      h.textContent=["💗","💖","💘","💞","💕","❤️"][Math.floor(Math.random()*6)];
      h.style.left=Math.random()*100+"vw";
      h.style.fontSize=(Math.random()*16+16)+"px";
      h.style.setProperty("--dx",(Math.random()*80-40)+"px");
      h.style.animationDuration=(Math.random()*2.5+3)+"s";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),6500);
    }
    setInterval(spawnHeart,450);

    noBtn.addEventListener("mouseenter", () => {
      noBtn.style.position="relative";
      noBtn.style.left=(Math.random()*200-100)+"px";
      noBtn.style.top=(Math.random()*80-40)+"px";
    });

    noBtn.addEventListener("click", () => {
      noBtn.dispatchEvent(new Event("mouseenter"));
    });

    yesBtn.addEventListener("click", () => {
      buttons.style.display="none";
      successBox.style.display="block";
      for(let i=0;i<18;i++) setTimeout(spawnHeart,i*80);
    });
  </script>
</body>
</html>
